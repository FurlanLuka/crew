version: 2

project_name: crew

builds:
  - main: .
    binary: crew
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0

# Voice OS rides the same release: built by voiceos/scripts/build-release.ts before
# GoReleaser runs, downloaded by `crew` (`crew server start`) for the matching version.
release:
  # The workflow reads it from the notes' heading (else "crew <version>").
  name_template: "{{ .Env.RELEASE_TITLE }}"
  extra_files:
    - glob: ../voiceos/dist/voiceos_*.tar.gz

# Release notes: GitHub's own, from the merged pull requests' titles (everything lands through one).
# A release with a story of its own gets docs/releases/<tag>.md instead (the workflow passes it).
changelog:
  use: github-native

checksum:
  extra_files:
    - glob: ../voiceos/dist/voiceos_*.tar.gz
