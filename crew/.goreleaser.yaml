version: 2

project_name: crew

# The voice gate's model packs live on a release of their own (voiceos/src/voice-gate/pack.ts):
# never the previous tag a crew release's changelog counts from.
git:
  ignore_tags:
    - "voice-gate-pack-*"

builds:
  - main: .
    binary: crew
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0

# Voice OS rides the same release: built by voiceos/scripts/build-release.ts before
# GoReleaser runs, downloaded by `crew voice` for the matching version.
release:
  extra_files:
    - glob: ../voiceos/dist/voiceos_*.tar.gz

checksum:
  extra_files:
    - glob: ../voiceos/dist/voiceos_*.tar.gz
