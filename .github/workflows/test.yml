name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: crew/go.mod
          cache-dependency-path: crew/go.sum

      - name: Build
        working-directory: crew
        run: go build -o crew .

      - name: Vet
        working-directory: crew
        run: go vet ./...

      - name: Test version flag
        working-directory: crew
        run: ./crew --version | grep -q "crew"

      - name: Test
        working-directory: crew
        run: go test ./...

  mod:
    # The crew pane: crew's Claude Code plugin mod, tested with Claude Code's
    # own kit. Pinned — the mods API still moves between releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295

      - name: Test the pane
        run: tests/run.sh
