name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: crew/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Voice OS
        working-directory: voiceos
        run: |
          bun install --frozen-lockfile
          bun scripts/build-release.ts "${GITHUB_REF_NAME}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: crew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
