name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: crew/go.mod
          cache-dependency-path: crew/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # A tag is a release: nothing ships that the tests have not passed on.
      - name: Test crew
        working-directory: crew
        run: go test ./...

      # Every platform's native packages (Discord's E2EE library ships one per platform): one runner
      # compiles all four binaries.
      - name: Install Voice OS dependencies
        working-directory: voiceos
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      # The unit and offline eval suites only; the paid evals and live audio tests never run in CI.
      - name: Test Voice OS
        working-directory: voiceos
        run: bun test src evals

      - name: Build Voice OS
        working-directory: voiceos
        run: bun scripts/build-release.ts "${GITHUB_REF_NAME}"

      # A hand-written docs/releases/<tag>.md wins: its heading ("# v6.5.0: A / menu in every
      # session") is the release's title, the rest its notes. Without one the title is the tag and
      # GoReleaser lists the merged PRs.
      - name: Release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          title="${GITHUB_REF_NAME}"
          if [ -f "$notes" ]; then
            heading="$(head -n 1 "$notes")"
            case "$heading" in "# "*) title="${heading#\# }" ;; esac
            tail -n +2 "$notes" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
          workdir: crew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
