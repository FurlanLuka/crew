name: Voice OS

on:
  push:
    branches: [main]
    paths: ["voiceos/**", "crew/cmd_voice*.go", "crew/internal/voice/**", ".github/workflows/voiceos.yml"]
  # Every pull request, so unit and golden always report: main requires them, and a PR that touches
  # nothing of Voice OS's gets them as skipped, which counts as passing.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      voiceos: ${{ steps.filter.outputs.voiceos }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            voiceos:
              - "voiceos/**"
              - "crew/cmd_voice*.go"
              - "crew/internal/voice/**"
              - ".github/workflows/voiceos.yml"

  unit:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.voiceos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceos
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx tsc --noEmit
      - run: bun test src evals
      - run: bunx playwright install --with-deps chromium
      - run: bun test test/ui

  # The JSON crew prints and the goldens Voice OS parses must agree; an edit
  # to voiceos/testdata alone would otherwise only trigger this workflow.
  golden:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.voiceos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crew/go.mod
          cache-dependency-path: crew/go.sum
      - working-directory: crew
        run: go test -run 'Golden' .
